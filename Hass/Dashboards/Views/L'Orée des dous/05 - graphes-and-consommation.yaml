  - type: grid
    cards:
      - type: custom:apexcharts-card
        graph_span: 30d
        update_interval: 1h
        header:
          show: true
          title: Rez (°C)
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 220
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: true
            position: bottom
            fontSize: 10px
          xaxis:
            labels:
              datetimeUTC: false
              format: dd/MM
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_10_temperature
            name: zg 227z 10 temperature · moy
            color: var(--info-color)
            type: line
            stroke_width: 2
            statistics:
              type: mean
              period: hour
              align: middle
          - entity: sensor.zg_227z_10_temperature
            name: zg 227z 10 temperature · max
            color: var(--warning-color)
            type: line
            stroke_width: 2
            statistics:
              type: max
              period: hour
              align: middle
          - entity: sensor.zg_227z_10_temperature
            name: zg 227z 10 temperature · min
            color: var(--success-color)
            type: line
            stroke_width: 2
            statistics:
              type: min
              period: hour
              align: middle
