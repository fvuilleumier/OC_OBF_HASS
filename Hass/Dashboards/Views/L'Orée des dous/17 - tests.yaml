              label:
                - font-size: 15px
                - color: var(--secondary-text-color)
              name:
                - align-self: end
                - font-size: 12px
                - color: var(--secondary-text-color)
          - type: custom:button-card
            entity: binary_sensor.router_lte_connected
            name: LTE
            icon: mdi:signal-off
            show_icon: true
            show_state: true
            show_label: true
            label: >
              [[[
                return entity?.state === "on" ? "UP" : "DOWN";
              ]]]
            state_display: >
              [[[
                return entity?.state === "on" ? "OK" : "N/C";
              ]]]
