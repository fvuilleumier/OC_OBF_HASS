# ♨️ CHAUFFAGE — section generique.
# Remplacer « trv_btr_02 » par le prefixe du sensor de position et
# « trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007 » par le nom de l'entite climate.
# Le binary_sensor _window et le switch _boost_heating derivent de ce meme nom.
type: grid
column_span: 1
cards:
  - type: custom:button-card
    template: section_title
    name: ♨️ Chauffage
  - type: custom:mushroom-climate-card
    entity: climate.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007
    name: Radiateur
    hvac_modes:
      - heat
      - "off"
    show_temperature_control: true
    collapsible_controls: false
  - type: custom:mushroom-template-card
    entity: sensor.trv_btr_02_position
    primary: "{{ states('sensor.trv_btr_02_position') | float(0) | round(0) }} %"
    secondary: État de la vanne
    icon: mdi:radiator
    vertical: true
    features_position: bottom
    tap_action:
      action: more-info
    color: >-
      {% set v = states('sensor.trv_btr_02_position') | float(0) %}
      {% if v > 70 %}red{% elif v > 20 %}orange{% else %}green{% endif %}
    card_mod:
      style: |
        {% set v = states('sensor.trv_btr_02_position') | float(0) %}
        mushroom-state-info$ .primary {
          {% if v > 70 %}color: var(--error-color) !important;
          {% elif v > 20 %}color: var(--orange-color) !important;
          {% else %}color: var(--success-color) !important;
          {% endif %}
        }
  - type: custom:mushroom-template-card
    entity: binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window
    primary: >-
      {% if is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window', 'on') %}Ouverte{% else %}Fermée{% endif %}
    secondary: Fenêtre
    icon: >-
      {% if is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window', 'on') %}mdi:window-open-variant{% else %}mdi:window-closed-variant{% endif %}
    vertical: true
    features_position: bottom
    tap_action:
      action: more-info
    color: >-
      {% if is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window', 'on') %}red{% else %}green{% endif %}
  - type: custom:mushroom-template-card
    entity: switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating
    primary: >-
      {% if is_state('switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating', 'on') %}Actif{% else %}Désactivé{% endif %}
    secondary: Boost chauffage
    icon: mdi:fire
    vertical: true
    features_position: bottom
    tap_action:
      action: toggle
    color: >-
      {% if is_state('switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating', 'on') %}orange{% else %}grey{% endif %}
