button_card_templates:
  section_title:
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - height: 34px
        - padding: 0 12px
        - background: transparent
        - background-color: null
        - border: none
        - border-radius: 0
        - box-shadow: none
      grid:
        - grid-template-areas: '"n"'
      name:
        - display: flex
        - align-items: center
        - justify-content: center
        - gap: 10px
        - width: 100%
        - color: var(--section-title-color, var(--primary-text-color))
        - font-size: 14px
        - font-weight: 400
    extra_styles: |
      #name::before,
      #name::after {
        content: "";
        height: 1px;
        background: var(--section-title-line-color, var(--divider-color));
        flex: 1;
      }
  section_title_upper:
    template: section_title
    styles:
      name:
        - text-transform: uppercase
        - white-space: nowrap
views:
  - theme: Backend-selected
    title: Home
    icon: mdi:home-assistant
    badges:
      - type: entity
        entity: switch.s1pm31
        show_entity_picture: true
        tap_action:
          action: toggle
        state_content: name
        color: orange
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: switch.s1pm59
        color: pink
        name: Déshumidificateur
        tap_action:
          action: toggle
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: switch.sb20
        color: green
        icon: mdi:pine-tree
        name: Sapin
        tap_action:
          action: toggle
      - type: entity
        show_name: true
        show_state: false
        show_icon: true
        entity: switch.sb18
        tap_action:
          action: toggle
    type: sections
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:mushroom-template-card
                primary: La vie est belle pour ceux qui la regardent avec le cœur
                secondary: >-
                  {{ states('sensor.moon_phase') | replace('_',' ') | capitalize
                  }}
                icon: mdi:home
                picture: "{{ state_attr('sensor.moon_phase_image','entity_picture') }}"
                tap_action:
                  action: none
                hold_action:
                  action: none
                double_tap_action:
                  action: none
                card_mod:
                  style: |
                    ha-card {
                      background-size: cover;
                      background-blend-mode: overlay;
                      background: url('/local/images/wp/moon_wp.png');
                      background-repeat: no-repeat;
                      background-size: cover;
                      padding: 5px;
                    }
                    :host {
                      --mush-icon-size: 60px;
                      --primary-text-color: #fff;
                      --secondary-text-color: #fff;
                      border-width: 0px;
                    }
              - type: custom:mushroom-chips-card
                chips:
                  - type: entity
                    entity: sensor.astroweather_la_TBX7D_ORG_0003_moon_next_rising
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    double_tap_action:
                      action: none
                    card_mod:
                      style: |
                        ha-card {
                          border: 0px outset black !important;
                        }
                  - type: entity
                    entity: sensor.astroweather_la_TBX7D_ORG_0003_moon_next_setting
                    tap_action:
                      action: none
                    hold_action:
                      action: none
                    double_tap_action:
                      action: none
                    card_mod:
                      style: |
                        ha-card {
                          border: 0px outset black !important;
                        }
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: >-
              {% if is_state('binary_sensor.production_panneaux_solaire','on')
              %}
                ☀️ Production active
              {% else %}
                🌙 Pas de production
              {% endif %}
            secondary: |
              {{ states('sensor.onduleur_des_dous_solar_power') }} W
            icon: >
              {% if is_state('binary_sensor.production_panneaux_solaire','on')
              %}
                mdi:solar-power
              {% else %}
                mdi:sun-angle-outline
              {% endif %}
            color: >
              {% if is_state('binary_sensor.production_panneaux_solaire','on')
              %}
                deep-orange
              {% else %}
                blue
              {% endif %}
            features_position: bottom
            multiline_secondary: false
            grid_options:
              columns: full
          - type: tile
            entity: lock.porte_1er
            vertical: false
            features:
              - type: lock-commands
            features_position: bottom
          - type: tile
            entity: lock.porte_rez
            features:
              - type: lock-commands
          - type: tile
            entity: switch.s146
            features:
              - type: toggle
          - type: tile
            entity: switch.s168
            features:
              - type: toggle
      - type: grid
        cards:
          - camera_view: auto
            fit_mode: cover
            type: picture-glance
            entities:
              - entity: sensor.zg_227z_14_temperature
                show_state: true
              - entity: sensor.zg_227z_14_humidity
                show_state: true
              - entity: sensor.zg_227z_07_temperature
                icon: mdi:arrow-up-bold-hexagon-outline
                show_state: true
              - entity: sensor.zg_227z_07_humidity
                show_state: true
              - entity: sensor.zg_227z_10_temperature
                icon: mdi:arrow-down-bold-hexagon-outline
                show_state: true
              - entity: sensor.zg_227z_10_humidity
                show_state: true
            title: La maison des Dous
            image:
              media_content_id: media-source://host0013.example.invalid/6c2db3f99378d8a9e7786befb240e128
              media_content_type: image/jpeg
              metadata:
                title: famille_hass_2.jpeg
                thumbnail: /api/image/serve/6c2db3f99378d8a9e7786befb240e128/256x256
                media_class: image
                navigateIds:
                  - {}
                  - media_content_type: app
                    media_content_id: media-source://host0013.example.invalid
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: IP publique
            secondary: "{{ states('sensor.myip') }}"
            icon: mdi:ip-network
            entity: sensor.myip
            icon_color: ""
            grid_options:
              columns: full
      - type: grid
        cards:
          - show_current: true
            show_forecast: true
            type: weather-forecast
            entity: weather.TBX7D_SECRET_0165
            forecast_type: daily
            name: La maison des dous
            secondary_info_attribute: humidity
            forecast_slots: 5
      - type: grid
        cards:
          - type: custom:horizon-card
            card_mod:
              style: |
                ha-card {
                  border: 0px outset black !important;
                  background: url('/local/images/wp/sea_wp_2.png');
                  background-repeat: no-repeat;
                  background-size: cover;
                }
      - type: grid
        cards:
          - type: shopping-list
            title: Ma todo list
    header:
      layout: center
      badges_position: bottom
      badges_wrap: wrap
      card:
        type: markdown
        text_only: true
        content: |-
          # 🏠 L'Orée des Dous
          ✨ Sois toi même, tous les autres sont déjà pris ✨
    footer:
      type: markdown
      content: ""
