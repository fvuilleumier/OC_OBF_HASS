title: Salon
path: salon
icon: mdi:sofa
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F518 Interactions"
      - type: tile
        entity: switch.s1pm31
        color: accent
        hide_state: true
        vertical: false
        features:
          - type: toggle
        features_position: bottom
      - type: tile
        entity: switch.sb50
        name: TV des Dous
        color: accent
        hide_state: true
        vertical: false
        features:
          - type: toggle
        features_position: bottom
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F321️ Conditions"
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Température · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            max: '|+0.5|'
            min: '|-0.5|'
            apex_config:
              tickAmount: 3
        series:
          - entity: sensor.zg_227z_18_temperature
            name: Température
            color: var(--success-color)
            type: area
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 10min
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Humidité · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_18_humidity
            name: Humidité
            color: var(--info-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ♨️ Chauffage
      - type: custom:mushroom-climate-card
        entity: climate.trv_btr_06_rez_sud_est_salon
        name: Radiateur
        hvac_modes:
          - heat
          - off
        show_temperature_control: true
        collapsible_controls: false
      - type: custom:mushroom-template-card
        entity: sensor.trv_btr_06_position
        primary: "{{ states('sensor.trv_btr_06_position') | float(0) | round(0) }} %"
        secondary: État de la vanne
        icon: mdi:radiator
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% set v = states('sensor.trv_btr_06_position') | float(0) %} {% if v > 70 %}red{% elif v > 20 %}orange{% else %}green{% endif %}"
        card_mod:
          style: >
            {% set v = states('sensor.trv_btr_06_position') | float(0) %}

            mushroom-state-info$ .primary {
              {% if v > 70 %}color: var(--error-color) !important;
              {% elif v > 20 %}color: var(--orange-color) !important;
              {% else %}color: var(--success-color) !important;
              {% endif %}
            }
      - type: custom:mushroom-template-card
        entity: binary_sensor.trv_btr_06_rez_sud_est_salon_window
        primary: "{% if is_state('binary_sensor.trv_btr_06_rez_sud_est_salon_window', 'on') %}Ouverte{% else %}Fermée{% endif %}"
        secondary: Fenêtre
        icon: "{% if is_state('binary_sensor.trv_btr_06_rez_sud_est_salon_window', 'on') %}mdi:window-open-variant{% else %}mdi:window-closed-variant{% endif %}"
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% if is_state('binary_sensor.trv_btr_06_rez_sud_est_salon_window', 'on') %}red{% else %}green{% endif %}"
      - type: custom:mushroom-template-card
        entity: switch.trv_btr_06_rez_sud_est_salon_boost_heating
        primary: "{% if is_state('switch.trv_btr_06_rez_sud_est_salon_boost_heating', 'on') %}Actif{% else %}Désactivé{% endif %}"
        secondary: Boost chauffage
        icon: mdi:fire
        vertical: true
        features_position: bottom
        tap_action:
          action: toggle
        color: "{% if is_state('switch.trv_btr_06_rez_sud_est_salon_boost_heating', 'on') %}orange{% else %}grey{% endif %}"
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚡ Énergie
      - type: custom:mushroom-template-card
        primary: Pas encore mesurée
        secondary: Aucun compteur électrique dédié à cette pièce n'est actuellement disponible.
        icon: mdi:power-plug-off
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F4DF Appareils"
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            alignment: center
            subtitle: "\U0001F4E1 SLZB-06M"
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06m_r_connection_mode
            icon: mdi:router-wireless
            primary: SLZB-06M
            secondary: "{{ states('sensor.slzb_06m_r_connection_mode') }}"
            color: >-
              {% if is_state('sensor.slzb_06m_r_connection_mode', 'eth') %}
                green
              {% else %}
                amber
              {% endif %}
            features_position: bottom
            multiline_secondary: false
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06m_r_core_chip_temp
            icon: mdi:chip
            icon_color: >-
              {% set t = states('sensor.slzb_06m_r_core_chip_temp') | float(0) %} {% if t >= 70 %}
                red
              {% elif t >= 55 %}
                amber
              {% else %}
                green
              {% endif %}
            primary: CPU
            secondary: "{{ states('sensor.slzb_06m_r_core_chip_temp') }} °C"
          - type: custom:mushroom-template-card
            entity: binary_sensor.slzb_06m_r_ethernet
            icon: mdi:ethernet
            icon_color: >-
              {% if is_state(entity, 'on') %}
                green
              {% else %}
                red
              {% endif %}
            primary: Ethernet
            secondary: "{% if is_state(entity, 'on') %}Connecté{% else %}Déconnecté{% endif %}"
          - type: custom:mushroom-template-card
            entity: binary_sensor.slzb_06m_r_internet
            icon: mdi:web
            icon_color: >-
              {% if is_state(entity, 'on') %}
                green
              {% else %}
                red
              {% endif %}
            primary: Internet
            secondary: "{% if is_state(entity, 'on') %}Connecté{% else %}Hors ligne{% endif %}"
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06m_r_firmware_channel
            icon: mdi:update
            icon_color: blue
            primary: Firmware
            secondary: "{{ states('sensor.slzb_06m_r_firmware_channel') }}"
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06m_r_zigbee_chip_temp
            icon: mdi:zigbee
            primary: Zigbee
            secondary: "{{ states('sensor.slzb_06m_r_zigbee_chip_temp') }} °C · {{ states('sensor.slzb_06m_r_zigbee_type') }}"
            color: >-
              {% set t = states('sensor.slzb_06m_r_zigbee_chip_temp') | float(0) %} {% if t >= 70 %}
                red
              {% elif t >= 55 %}
                amber
              {% else %}
                green
              {% endif %}
            features_position: bottom
        column_span: 2
        grid_options:
          rows: auto
          columns: 6
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F9ED Navigation"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Toutes les pièces
            icon: mdi:home
            color: blue
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/maison
          - type: custom:mushroom-template-card
            primary: Surveillance
            icon: mdi:alert-remove
            color: purple
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/appareils-oublies
          - type: custom:mushroom-template-card
            primary: Santé système
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/sante-systeme
cards: []
badges: []
header:
  card:
    type: markdown
    text_only: true
    content: "# \U0001F6CB️ Salon"
