button_card_templates:
  section_title:
    show_icon: false
    show_state: false
    tap_action:
      action: none
    styles:
      card:
        - height: 34px
        - padding: 0 12px
        - background: transparent
        - background-color: null
        - border: none
        - border-radius: 0
        - box-shadow: none
      grid:
        - grid-template-areas: '"n"'
      name:
        - display: flex
        - align-items: center
        - justify-content: center
        - gap: 10px
        - width: 100%
        - color: var(--section-title-color, var(--primary-text-color))
        - font-size: 14px
        - font-weight: 400
    extra_styles: |
      #name::before,
      #name::after {
        content: "";
        height: 1px;
        background: var(--section-title-line-color, var(--divider-color));
        flex: 1;
      }
  section_title_upper:
    template: section_title
    styles:
      name:
        - text-transform: uppercase
        - white-space: nowrap
views:
  - title: Maison des Dous
    path: maison-des-dous
    icon: mdi:home-heart
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🔘 Interactions
          - type: tile
            entity: lock.porte_1er
            features:
              - type: lock-commands
          - type: tile
            entity: lock.porte_rez
            features:
              - type: lock-commands
          - type: tile
            entity: switch.sb18
            name: Lumières exterieur Noël
            hide_state: true
            vertical: true
            features:
              - type: toggle
            features_position: bottom
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🌡️ Conditions
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Température · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 120
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - decimals: 1
                max: "|+0.5|"
                min: "|-0.5|"
                apex_config:
                  tickAmount: 3
            series:
              - entity: sensor.zg_227z_07_temperature
                name: Température
                color: var(--success-color)
                type: area
                stroke_width: 2
                float_precision: 1
                group_by:
                  func: avg
                  duration: 10min
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Humidité · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 120
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.zg_227z_07_humidity
                name: Humidité
                color: var(--info-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: ⚡ Énergie
          - type: custom:mushroom-template-card
            primary: Dashboard
            secondary: Rendez-vous au dashboard Énergie de l'Orée des Dous
            icon: mdi:link-variant
            features_position: bottom
            vertical: true
            multiline_secondary: false
            grid_options:
              columns: full
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/energy
            color: amber
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 📟 Appareils
          - type: custom:mushroom-template-card
            primary: Aucun appareil dans cette pièce
            secondary: Zone réservée aux appareils de la pièce
            icon: mdi:gesture-tap-button
            features_position: bottom
            vertical: true
            multiline_secondary: false
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🧭 Navigation
          - type: grid
            cards:
              - type: custom:mushroom-template-card
                primary: Toutes les pièces
                icon: mdi:home
                color: blue
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/maison
              - type: custom:mushroom-template-card
                primary: Surveillance
                icon: mdi:alert-remove
                color: purple
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/appareils-oublies
              - type: custom:mushroom-template-card
                primary: Santé système
                icon: mdi:heart-pulse
                color: red
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/sante-systeme
    cards: []
    badges: []
    header:
      card:
        type: markdown
        text_only: true
        content: "# 🏠 L'Orée des Dous"
