title: Serveur
path: serveur
icon: mdi:server
type: custom:grid-layout
layout:
  margin: 0
  padding: 0
  grid-gap: 10px
  grid-template-columns: repeat(12, minmax(0, 1fr))
  grid-template-areas: >
    "conditions conditions conditions conditions conditions conditions energy
    energy energy energy energy energy"

    "devices devices devices devices devices devices devices devices devices
    devices devices devices"

    "navigation navigation navigation navigation navigation navigation
    navigation navigation interactions interactions interactions interactions"
  mediaquery:
    '(max-width: 1000px)':
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-template-areas: |
        "conditions energy"
        "devices devices"
        "navigation navigation"
        "interactions interactions"
    '(max-width: 700px)':
      grid-template-columns: minmax(0, 1fr)
      grid-template-areas: |
        "conditions"
        "energy"
        "devices"
        "navigation"
        "interactions"
badges:
  - type: entity
    entity: sensor.zg_227z_11_temperature
  - type: entity
    entity: sensor.zg_227z_11_humidity
cards:
  - type: custom:stack-in-card
    view_layout:
      grid-area: conditions
    card_mod:
      style: |
        ha-card {
          background: #282a3a;
          border: 0 !important;
          border-radius: 6px;
          box-shadow: none !important;
          overflow: hidden;
        }
    cards:
      - type: custom:button-card
        name: CONDITIONS
        show_icon: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - height: 34px
            - padding: 0 12px
            - background: transparent
            - border: none
            - border-radius: 0
            - box-shadow: none
          grid:
            - grid-template-areas: '"n"'
          name:
            - display: flex
            - align-items: center
            - justify-content: center
            - gap: 10px
            - width: 100%
            - color: '#f3f3f6'
            - font-size: 14px
            - font-weight: 400
        extra_styles: |
          #name::before,
          #name::after {
            content: "";
            height: 1px;
            background: #8d8f9c;
            flex: 1;
          }
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          margin: 0
          padding: 3px 10px 0
          grid-gap: 8px
          grid-template-columns: repeat(2, minmax(0, 1fr))
        cards:
          - type: custom:button-card
            entity: sensor.zg_227z_11_temperature
            name: TEMPÉRATURE
            icon: mdi:thermometer
            show_icon: true
            show_state: true
            show_label: true
            label: Serveur
            state_display: |
              [[[
                const value = parseFloat(entity?.state);
                return Number.isFinite(value)
                  ? value.toFixed(1) + " °C"
                  : entity?.state;
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 130px
                - padding: 8px 4px
                - background: rgba(255,255,255,0.018)
                - border: 1px solid rgba(255,255,255,0.035)
                - border-radius: 5px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i" "s" "l" "n"'
                - grid-template-rows: 39px 34px 22px 20px
              icon:
                - width: 37px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value < 18) return "#398cff";
                      if (value < 21) return "#82df2f";
                      if (value < 24) return "#efa928";
                      return "#e84b52";
                    ]]]
              state:
                - font-size: 25px
                - font-weight: 400
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value < 18) return "#398cff";
                      if (value < 21) return "#82df2f";
                      if (value < 24) return "#efa928";
                      return "#e84b52";
                    ]]]
              label:
                - font-size: 11px
                - color: '#aeb0bd'
              name:
                - font-size: 10px
                - color: '#aeb0bd'
          - type: custom:button-card
            entity: sensor.zg_227z_11_humidity
            name: HUMIDITÉ
            icon: mdi:water-percent
            show_icon: true
            show_state: true
            show_label: true
            label: Serveur
            state_display: |
              [[[
                const value = parseFloat(entity?.state);
                return Number.isFinite(value)
                  ? value.toFixed(1) + " %"
                  : entity?.state;
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 130px
                - padding: 8px 4px
                - background: rgba(255,255,255,0.018)
                - border: 1px solid rgba(255,255,255,0.035)
                - border-radius: 5px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i" "s" "l" "n"'
                - grid-template-rows: 39px 34px 22px 20px
              icon:
                - width: 37px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value < 40) return "#efa928";
                      if (value <= 60) return "#82df2f";
                      return "#398cff";
                    ]]]
              state:
                - font-size: 25px
                - font-weight: 400
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value < 40) return "#efa928";
                      if (value <= 60) return "#82df2f";
                      return "#398cff";
                    ]]]
              label:
                - font-size: 11px
                - color: '#aeb0bd'
              name:
                - font-size: 10px
                - color: '#aeb0bd'
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Évolution 24 h
          show_states: false
        yaxis:
          - id: temperature
            decimals: 1
            apex_config:
              tickAmount: 4
          - id: humidity
            opposite: true
            min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        apex_config:
          chart:
            height: 225
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          grid:
            borderColor: '#444654'
            strokeDashArray: 0
            padding:
              left: 2
              right: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          fill:
            type: gradient
            gradient:
              shadeIntensity: 0.25
              opacityFrom: 0.38
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          legend:
            show: true
            position: bottom
            fontSize: 10px
            labels:
              colors: '#aeb0bd'
            markers:
              width: 8
              height: 8
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                colors: '#aeb0bd'
                fontSize: 9px
          tooltip:
            theme: dark
        series:
          - entity: sensor.zg_227z_11_temperature
            name: Température
            yaxis_id: temperature
            color: '#efa928'
            type: area
            stroke_width: 2
            group_by:
              func: avg
              duration: 15min
          - entity: sensor.zg_227z_11_humidity
            name: Humidité
            yaxis_id: humidity
            color: '#398cff'
            type: area
            stroke_width: 2
            group_by:
              func: avg
              duration: 15min
        card_mod:
          style: |
            ha-card {
              height: 282px;
              padding: 0 9px !important;
              background: transparent;
              border: none;
              border-radius: 0;
              box-shadow: none;
            }
            .header {
              min-height: 38px !important;
              padding: 0 !important;
            }
            .header__title {
              display: flex;
              align-items: center;
              gap: 10px;
              width: 100%;
              color: #f2f2f5 !important;
              font-size: 13px !important;
              font-weight: 400 !important;
            }
            .header__title::before,
            .header__title::after {
