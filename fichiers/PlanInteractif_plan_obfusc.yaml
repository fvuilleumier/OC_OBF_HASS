# =====================================================================
#  🏡 PLAN INTERACTIF — variante « plan »
#  Même navigation que PlanInteractif_tile.yaml, mais les pièces sont
#  des pastilles posées sur les plans d'architecte au lieu de tuiles.
# ---------------------------------------------------------------------
#  POSITIONNER UNE PASTILLE
#  `top` et `left` sont des pourcentages de l'image, mesurés depuis le
#  coin haut-gauche, et désignent le CENTRE de l'icône. Pour déplacer
#  une pièce il suffit donc d'ajuster ces deux valeurs ; 1 % ≈ 12 px sur
#  ces plans. Le commentaire de chaque pastille rappelle le nom que la
#  pièce porte sur le plan d'architecte.
#
#  AJOUTER UNE PASTILLE
#  Copier un bloc `- type: icon`, changer l'icône, le `title` (affiché
#  au survol), le `navigation_path` et les deux pourcentages.
#
#  IMAGE
#  La forme `media_content_id` est celle que produit l'éditeur de HA.
#  Si un jour elle pose problème, l'URL directe fonctionne aussi :
#    image: /api/image/serve/<id>/original
#
#  STYLE
#  Les plans sont blancs : les pastilles sont donc un disque sombre
#  (card-background-color) sur lequel l'icône et l'anneau portent la
#  couleur de la famille de pièce. Toutes viennent du thème :
#    purple  chambres et salle de jeu     cyan    WC et salles de bain
#    orange  salon, salle à manger, cuisine  info  bureaux
#    warning technique et annexes         error   cave
#    success jardin                        secondary-text  couloirs
#  La boîte fait 32 px pour 20 px d'icône : c'est ce qui garantit un
#  cercle parfait plutôt qu'un ovale.
# =====================================================================
