        cards:
          - type: custom:apexcharts-card
            graph_span: 6h
            update_interval: 1min
            header:
              show: true
              title: WAN Throughput
              show_states: false
            yaxis:
              - min: 0
                decimals: 1
                apex_config:
                  tickAmount: 4
            all_series_config:
              stroke_width: 2
              curve: smooth
              group_by:
                func: avg
                duration: 1min
            apex_config:
              chart:
                height: 260px
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              grid:
                borderColor: var(--divider-color)
