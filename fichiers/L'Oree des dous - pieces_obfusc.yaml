      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: ♨️ Chauffage
          - type: custom:mushroom-climate-card
            entity: climate.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007
            name: Radiateur
            hvac_modes:
              - heat
              - "off"
            show_temperature_control: true
            collapsible_controls: false
          - type: custom:mushroom-template-card
            entity: sensor.trv_btr_02_position
            primary: "{{ states('sensor.trv_btr_02_position') | float(0) | round(0) }} %"
            secondary: État de la vanne
            icon: mdi:radiator
            vertical: true
            features_position: bottom
            tap_action:
              action: more-info
            color: >-
              {% set v = states('sensor.trv_btr_02_position') | float(0) %} {%
              if v > 70 %}red{% elif v > 20 %}orange{% else %}green{% endif %}
            card_mod:
              style: |
                {% set v = states('sensor.trv_btr_02_position') | float(0) %}
                mushroom-state-info$ .primary {
                  {% if v > 70 %}color: var(--error-color) !important;
                  {% elif v > 20 %}color: var(--orange-color) !important;
                  {% else %}color: var(--success-color) !important;
                  {% endif %}
                }
          - type: custom:mushroom-template-card
            entity: binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window
            primary: >-
              {% if
              is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window',
              'on') %}Ouverte{% else %}Fermée{% endif %}
            secondary: Fenêtre
            icon: >-
              {% if
              is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window',
              'on') %}mdi:window-open-variant{% else
              %}mdi:window-closed-variant{% endif %}
            vertical: true
            features_position: bottom
            tap_action:
              action: more-info
            color: >-
              {% if
              is_state('binary_sensor.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_window',
              'on') %}red{% else %}green{% endif %}
          - type: custom:mushroom-template-card
            entity: switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating
            primary: >-
              {% if
              is_state('switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating',
              'on') %}Actif{% else %}Désactivé{% endif %}
            secondary: Boost chauffage
            icon: mdi:fire
            vertical: true
            features_position: bottom
            tap_action:
              action: toggle
            color: >-
              {% if
              is_state('switch.trv_btr_02_chambre_1er_sud_ouest_TBX7D_ORG_0007_boost_heating',
              'on') %}orange{% else %}grey{% endif %}
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: ⚡ Énergie
          - type: gauge
            entity: sensor.s1pm31_power
            name: Puissance pièce
            needle: true
            min: 0
            max: 600
            severity:
              green: 0
              yellow: 360
              red: 510
            grid_options:
              columns: 6
              rows: auto
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:mushroom-template-card
                entity: sensor.s1pm31_power
                icon: mdi:flash
                icon_color: orange
                primary: "{{ states('sensor.s1pm31_power') | float(0) | round(0) }} W"
                secondary: Puissance actuelle
                tap_action:
                  action: more-info
                vertical: true
              - type: custom:mushroom-template-card
                entity: sensor.s1pm31_energy_day
                icon: mdi:lightning-bolt
                icon_color: amber
                primary: >-
                  {{ states('sensor.s1pm31_energy_day') | float(0) | round(2) }}
                  kWh
                secondary: Énergie du jour (24 h)
                tap_action:
                  action: more-info
                vertical: true
            grid_options:
              columns: 6
              rows: auto
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Puissance · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 180
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: "|+10|"
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.s1pm31_power
                name: Serveurs
                color: var(--warning-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
            grid_options:
              columns: full
              rows: auto
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 📟 Appareils
          - type: custom:vertical-stack-in-card
            cards:
              - type: custom:mushroom-title-card
                alignment: center
                subtitle: 💡 Lampe salon
              - type: custom:mushroom-template-card
                entity: switch.s1pm31
                icon: mdi:pump
                primary: >-
                  {% set p = states('sensor.s1pm31_power') | float(0) %} {% if
                  not is_state('switch.s1pm31', 'on') %}Hors tension {% elif p >
                  5 %}En marche {% else %}En veille{% endif %}
                secondary: "{{ states('sensor.s1pm31_power') | float(0) | round(0) }} W"
                tap_action:
                  action: toggle
                color: >-
                  {% set p = states('sensor.s1pm31_power') | float(0) %} {% if
                  not is_state('switch.s1pm31', 'on') %}red {% elif p > 5
