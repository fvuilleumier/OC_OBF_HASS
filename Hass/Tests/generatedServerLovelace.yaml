                        : "#efa928";
                    ]]]
              label:
                - justify-self: start
                - font-size: 11px
                - color: "#aeb0bd"
              name:
                - justify-self: start
                - font-size: 11px
                - color: "#aeb0bd"

          - type: custom:button-card
            entity: sensor.slzb_06m_core_chip_temp
            name: CPU
            icon: mdi:chip
            show_icon: true
            show_state: true
            show_label: true
