            icon_color: amber
            primary: "{{ states('sensor.sp1pm62_power') | float(0) | round(0) }} W · {{ states('sensor.sp1pm62_energy') | float(0) | round(2) }} kWh"
            secondary: Consommation cumulée
            tap_action:
              action: more-info
        column_span: 2
        grid_options:
          rows: auto
          columns: full
      - type: custom:vertical-stack-in-card
