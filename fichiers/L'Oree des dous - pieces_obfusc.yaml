                    width: 2
                  dataLabels:
                    enabled: false
                  markers:
                    size: 0
                  legend:
                    show: false
                  fill:
                    type: gradient
                    gradient:
                      opacityFrom: 0.42
                      opacityTo: 0.03
                      stops:
                        - 0
                        - 85
                        - 100
                  xaxis:
                    labels:
                      datetimeUTC: false
                      format: HH:mm
                      style:
                        fontSize: 10px
                yaxis:
                  - min: 0
                    max: "|+10|"
                    decimals: 0
                    apex_config:
                      tickAmount: 4
                series:
                  - entity: sensor.s1pm31_power
                    name: Maintenant
                    color: var(--warning-color)
                    type: area
                    stroke_width: 2
                    float_precision: 0
                    group_by:
