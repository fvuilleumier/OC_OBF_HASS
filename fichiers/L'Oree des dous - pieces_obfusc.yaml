                icon: mdi:lightning-bolt
                icon_color: amber
                primary: "{{ states('sensor.s1pm31_energy') | float(0) | round(2) }} kWh"
                secondary: Consommation cumulée
                tap_action:
                  action: more-info
            column_span: 2
            grid_options:
              rows: auto
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🧭 Navigation
          - type: grid
            cards:
              - type: custom:mushroom-template-card
                primary: Toutes les pièces
                icon: mdi:home
                color: blue
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/maison
              - type: custom:mushroom-template-card
                primary: Surveillance
                icon: mdi:alert-remove
                color: purple
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/appareils-oublies
              - type: custom:mushroom-template-card
                primary: Santé système
                icon: mdi:heart-pulse
                color: red
                vertical: true
                features_position: bottom
                tap_action:
                  action: navigate
                  navigation_path: /la-maison-des-dous/sante-systeme
