  - title: Toilettes 1er
    path: toilettes-1er
    icon: mdi:paper-roll-outline
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🔘 Interactions
          - type: custom:mushroom-template-card
            primary: Aucune interaction configurée
            secondary: Zone réservée aux commandes de la pièce
            icon: mdi:gesture-tap
            features_position: bottom
            vertical: true
            multiline_secondary: false
            grid_options:
              columns: full
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: 🌡️ Conditions
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Température · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 120
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - decimals: 1
                max: "|+0.5|"
                min: "|-0.5|"
                apex_config:
                  tickAmount: 3
            series:
              - entity: sensor.zg_227z_11_temperature
                name: Température
                color: var(--success-color)
                type: area
                stroke_width: 2
                float_precision: 1
                group_by:
                  func: avg
                  duration: 10min
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Humidité · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 120
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: 100
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.zg_227z_11_humidity
                name: Humidité
                color: var(--info-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
      - type: grid
        column_span: 1
        cards:
          - type: custom:button-card
            template: section_title
            name: ⚡ Énergie
