title: Salle de jeu
path: salle-de-jeu
icon: mdi:nintendo-game-boy
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F518 Interactions"
      - type: custom:mushroom-template-card
        primary: Aucune interaction configurée
        secondary: Zone réservée aux commandes de la pièce
        icon: mdi:gesture-tap
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F321️ Conditions"
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Température · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            max: '|+0.5|'
            min: '|-0.5|'
            apex_config:
              tickAmount: 3
        series:
          - entity: sensor.zg_227z_09_temperature
            name: Température
            color: var(--success-color)
            type: area
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 10min
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Humidité · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_09_humidity
            name: Humidité
            color: var(--info-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ♨️ Chauffage
      - type: custom:mushroom-climate-card
        entity: climate.trv_btr_04_chambre_rez_salle_de_jeu
        name: Radiateur
        hvac_modes:
          - heat
          - off
        show_temperature_control: true
        collapsible_controls: false
      - type: custom:mushroom-template-card
        entity: sensor.trv_btr_04_position
        primary: "{{ states('sensor.trv_btr_04_position') | float(0) | round(0) }} %"
        secondary: État de la vanne
        icon: mdi:radiator
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% set v = states('sensor.trv_btr_04_position') | float(0) %} {% if v > 70 %}red{% elif v > 20 %}orange{% else %}green{% endif %}"
        card_mod:
          style: >
            {% set v = states('sensor.trv_btr_04_position') | float(0) %}

            mushroom-state-info$ .primary {
              {% if v > 70 %}color: var(--error-color) !important;
              {% elif v > 20 %}color: var(--orange-color) !important;
              {% else %}color: var(--success-color) !important;
              {% endif %}
            }
      - type: custom:mushroom-template-card
        entity: binary_sensor.trv_btr_04_chambre_rez_salle_de_jeu_window
        primary: "{% if is_state('binary_sensor.trv_btr_04_chambre_rez_salle_de_jeu_window', 'on') %}Ouverte{% else %}Fermée{% endif %}"
        secondary: Fenêtre
        icon: "{% if is_state('binary_sensor.trv_btr_04_chambre_rez_salle_de_jeu_window', 'on') %}mdi:window-open-variant{% else %}mdi:window-closed-variant{% endif %}"
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% if is_state('binary_sensor.trv_btr_04_chambre_rez_salle_de_jeu_window', 'on') %}red{% else %}green{% endif %}"
      - type: custom:mushroom-template-card
        entity: switch.trv_btr_04_chambre_rez_salle_de_jeu_boost_heating
        primary: "{% if is_state('switch.trv_btr_04_chambre_rez_salle_de_jeu_boost_heating', 'on') %}Actif{% else %}Désactivé{% endif %}"
        secondary: Boost chauffage
        icon: mdi:fire
        vertical: true
        features_position: bottom
        tap_action:
          action: toggle
        color: "{% if is_state('switch.trv_btr_04_chambre_rez_salle_de_jeu_boost_heating', 'on') %}orange{% else %}grey{% endif %}"
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚡ Énergie
      - type: custom:mushroom-template-card
        primary: Pas encore mesurée
        secondary: Aucun compteur électrique dédié à cette pièce n'est actuellement disponible.
        icon: mdi:power-plug-off
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F4DF Appareils"
      - type: custom:mushroom-template-card
        primary: Aucun appareil dans cette pièce
        secondary: Zone réservée aux appareils de la pièce
        icon: mdi:gesture-tap-button
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F9ED Navigation"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Toutes les pièces
            icon: mdi:home
            color: blue
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/maison
          - type: custom:mushroom-template-card
            primary: Surveillance
            icon: mdi:alert-remove
            color: purple
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/appareils-oublies
          - type: custom:mushroom-template-card
            primary: Santé système
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/sante-systeme
cards: []
badges: []
header:
  card:
    type: markdown
    text_only: true
    content: "# \U0001F3AE️ Salle de jeu"
