title: Atelier
path: atelier
icon: mdi:hammer-wrench
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F518 Interactions"
      - type: custom:mushroom-template-card
        primary: Aucune interaction configurée
        secondary: Zone réservée aux commandes de la pièce
        icon: mdi:gesture-tap
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F321️ Conditions"
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Température · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            max: '|+0.5|'
            min: '|-0.5|'
            apex_config:
              tickAmount: 3
        series:
          - entity: sensor.zg_227z_13_temperature
            name: Température
            color: var(--success-color)
            type: area
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 10min
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Humidité · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_13_humidity
            name: Humidité
            color: var(--info-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚡ Énergie
      - type: gauge
        entity: sensor.atelier_power
        name: Puissance pièce
        needle: true
        min: 0
        max: 2500
        severity:
          green: 0
          yellow: 1500
          red: 2125
        grid_options:
          columns: 6
          rows: auto
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.atelier_power
            icon: mdi:flash
            primary: "{{ states('sensor.atelier_power') | float(0) | round(0) }} W"
            secondary: Puissance actuelle
            tap_action:
              action: more-info
            color: orange
            features_position: bottom
            vertical: true
          - type: custom:mushroom-template-card
            entity: sensor.atelier_energy_day
            icon: mdi:lightning-bolt
            primary: "{{ states('sensor.atelier_energy_day') | float(0) | round(2) }} kWh"
            secondary: Énergie du jour (24 h)
            tap_action:
              action: more-info
            color: amber
            features_position: bottom
            vertical: true
        grid_options:
          columns: 6
          rows: auto
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Puissance · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 180
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: '|+10|'
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.atelier_power
            name: Atelier
            color: var(--warning-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
        grid_options:
          columns: full
          rows: auto
      - type: custom:mushroom-template-card
        entity: sensor.s1pm40_power
        primary: "{{ states('sensor.s1pm40_power') | float(0) | round(0) }} W · {{ states('sensor.s1pm40_energy_day') | float(0) | round(2) }} kWh"
        secondary: Compresseur
        icon: mdi:air-compressor
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% if states('sensor.s1pm40_power') | float(0) > 5 %}orange{% else %}grey{% endif %}"
        grid_options:
          columns: 6
          rows: auto
      - type: custom:mushroom-template-card
        entity: sensor.msws65_atelier_power
        primary: "{{ states('sensor.msws65_atelier_power') | float(0) | round(0) }} W · {{ states('sensor.msws65_atelier_energy_day') | float(0) | round(2) }} kWh"
        secondary: Chargeurs
        icon: mdi:battery-charging-medium
        vertical: true
        features_position: bottom
        tap_action:
          action: more-info
        color: "{% if states('sensor.msws65_atelier_power') | float(0) > 5 %}orange{% else %}grey{% endif %}"
        grid_options:
          columns: 6
          rows: auto
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F4DF Appareils"
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            subtitle: "\U0001F4E1 SLZB-06MRUA"
            alignment: center
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06mra_connection_mode
            icon: mdi:router-wireless
            primary: SLZB-06MRUA
            secondary: "{{ states('sensor.slzb_06mra_connection_mode') }}"
            color: >-
              {% if is_state('binary_sensor.slzb_06mra_ethernet', 'eth') %}
                green
              {% else %}
                amber
              {% endif %}
            features_position: bottom
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06mra_r_core_chip_temp
            icon: mdi:chip
            icon_color: >-
              {% set t = states('sensor.slzb_06mra_r_core_chip_temp') | float(0) %} {% if t >= 70 %}
                red
              {% elif t >= 55 %}
                amber
              {% else %}
                green
              {% endif %}
            primary: CPU
            secondary: "{{ states('sensor.slzb_06mra_core_chip_temp') }} °C"
            layout: horizontal
          - type: custom:mushroom-template-card
            entity: binary_sensor.slzb_06mra_ethernet
            icon: mdi:ethernet
            icon_color: >-
              {% if is_state(entity, 'on') %}
                green
              {% else %}
                red
              {% endif %}
            primary: Ethernet
            secondary: "{% if is_state(entity, 'on') %}Connecté{% else %}Déconnecté{% endif %}"
            layout: horizontal
          - type: custom:mushroom-template-card
            entity: binary_sensor.slzb_06mra_internet
            icon: mdi:web
            icon_color: >-
              {% if is_state(entity, 'on') %}
                green
              {% else %}
                red
              {% endif %}
            primary: Internet
            secondary: "{% if is_state(entity, 'on') %}Connecté{% else %}Hors ligne{% endif %}"
            layout: horizontal
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06mra_firmware_channel
            icon: mdi:update
            icon_color: blue
            primary: Firmware
            secondary: "{{ states('sensor.slzb_06mra_firmware_channel') }}"
            layout: horizontal
          - type: custom:mushroom-template-card
            entity: sensor.slzb_06mra_zigbee_chip_temp
            icon: mdi:zigbee
            icon_color: >-
              {% set t = states('sensor.slzb_06mra_zigbee_chip_temp') | float(0) %} {% if t >= 70 %}
                red
              {% elif t >= 55 %}
                amber
              {% else %}
                green
              {% endif %}
            primary: Zigbee
            secondary: "{{ states('sensor.slzb_06mra_zigbee_chip_temp') }} °C · {{ states('sensor.slzb_06mra_zigbee_type') }}"
            layout: horizontal
        column_span: 2
        grid_options:
          rows: auto
          columns: 6
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            alignment: center
            subtitle: "\U0001FAAB Chargeurs"
          - type: custom:mushroom-template-card
            entity: switch.msws65_atelier
            icon: mdi:pump
            primary: "{% set p = states('sensor.msws65_atelier_power') | float(0) %} {% if not is_state('switch.msws65_atelier', 'on') %}Hors tension {% elif p > 5 %}En marche {% else %}En veille{% endif %}"
            secondary: "{{ states('sensor.msws65_atelier_power') | float(0) | round(0) }} W"
            tap_action:
              action: toggle
            color: "{% set p = states('sensor.msws65_atelier_power') | float(0) %} {% if not is_state('switch.msws65_atelier', 'on') %}red {% elif p > 5 %}orange {% else %}green{% endif %}"
          - type: gauge
            entity: sensor.msws65_atelier_power
            name: Puissance
            needle: true
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 35
              red: 60
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Puissance · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 160
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: '|+10|'
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.msws65_atelier_power
                name: Maintenant
                color: var(--warning-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.msws65_atelier_power
                name: moy 24 h
                color: var(--info-color)
                float_precision: 0
                group_by:
                  func: avg
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
              - entity: sensor.msws65_atelier_power
                name: pic 24 h
                color: var(--error-color)
                float_precision: 0
                group_by:
                  func: max
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
          - type: custom:mushroom-template-card
            entity: sensor.msws65_atelier_energy
            icon: mdi:lightning-bolt
            icon_color: amber
            primary: "{{ states('sensor.msws65_atelier_energy') | float(0) | round(2) }} kWh"
            secondary: Consommation cumulée
            tap_action:
              action: more-info
        column_span: 2
        grid_options:
          rows: auto
          columns: full
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            alignment: center
            subtitle: ⚙️ Compresseur
          - type: custom:mushroom-template-card
            entity: switch.s1pm40
            icon: mdi:pump
            primary: "{% set p = states('sensor.s1pm40_power') | float(0) %} {% if not is_state('switch.s1pm40', 'on') %}Hors tension {% elif p > 5 %}En marche {% else %}En veille{% endif %}"
            secondary: "{{ states('sensor.s1pm40_power') | float(0) | round(0) }} W"
            tap_action:
              action: toggle
            color: "{% set p = states('sensor.s1pm40_power') | float(0) %} {% if not is_state('switch.s1pm40', 'on') %}red {% elif p > 5 %}orange {% else %}green{% endif %}"
          - type: gauge
            entity: sensor.s1pm40_power
            name: Puissance
            needle: true
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 35
              red: 60
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Puissance · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 160
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: '|+10|'
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.s1pm40_power
                name: Maintenant
                color: var(--warning-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.s1pm40_power
                name: moy 24 h
                color: var(--info-color)
                float_precision: 0
                group_by:
                  func: avg
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
              - entity: sensor.s1pm40_power
                name: pic 24 h
                color: var(--error-color)
                float_precision: 0
                group_by:
                  func: max
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
          - type: custom:mushroom-template-card
            entity: sensor.s1pm40_energy
            icon: mdi:lightning-bolt
            icon_color: amber
            primary: "{{ states('sensor.s1pm40_energy') | float(0) | round(2) }} kWh"
            secondary: Consommation cumulée
            tap_action:
              action: more-info
        column_span: 2
        grid_options:
          rows: auto
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F9ED Navigation"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Toutes les pièces
            icon: mdi:home
            color: blue
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/maison
          - type: custom:mushroom-template-card
            primary: Surveillance
            icon: mdi:alert-remove
            color: purple
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/appareils-oublies
          - type: custom:mushroom-template-card
            primary: Santé système
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/sante-systeme
cards: []
badges: []
header:
  card:
    type: markdown
    text_only: true
    content: "# \U0001F6E0️ Atelier"
