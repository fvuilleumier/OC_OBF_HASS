# 🌡️ CONDITIONS — section generique.
# Remplacer « zg_227z_11 » par le prefixe du capteur de la piece (6 occurrences).
# Si le capteur n'existe pas encore, utiliser zg_227z_99.
type: grid
column_span: 1
cards:
  - type: custom:button-card
    template: section_title
    name: 🌡️ CONDITIONS
  - type: custom:mushroom-template-card
    entity: sensor.zg_227z_11_temperature
    primary: "{{ states('sensor.zg_227z_11_temperature') | float(0) | round(1) }} °C"
    secondary: Température
    icon: mdi:thermometer
    vertical: true
    features_position: bottom
    tap_action:
      action: more-info
    color: >-
      {% set v = states('sensor.zg_227z_11_temperature') | float(0) %}
      {% if v < 18 %}blue{% elif v < 21 %}green{% elif v < 24 %}orange{% else %}red{% endif %}
    card_mod:
      style: |
        {% set v = states('sensor.zg_227z_11_temperature') | float(0) %}
        mushroom-state-info$ .primary {
          {% if v < 18 %}color: var(--blue-color) !important;
          {% elif v < 21 %}color: var(--success-color) !important;
          {% elif v < 24 %}color: var(--orange-color) !important;
          {% else %}color: var(--error-color) !important;
          {% endif %}
        }
  - type: custom:mushroom-template-card
    entity: sensor.zg_227z_11_humidity
    primary: "{{ states('sensor.zg_227z_11_humidity') | float(0) | round(0) }} %"
    secondary: Humidité
    icon: mdi:water-percent
    vertical: true
    features_position: bottom
    tap_action:
      action: more-info
    color: >-
      {% set v = states('sensor.zg_227z_11_humidity') | float(0) %}
      {% if v < 40 %}orange{% elif v <= 60 %}green{% else %}blue{% endif %}
    card_mod:
      style: |
        {% set v = states('sensor.zg_227z_11_humidity') | float(0) %}
        mushroom-state-info$ .primary {
          {% if v < 40 %}color: var(--orange-color) !important;
          {% elif v <= 60 %}color: var(--success-color) !important;
          {% else %}color: var(--blue-color) !important;
          {% endif %}
        }
  - type: custom:apexcharts-card
    graph_span: 24h
    update_interval: 5min
    header:
      show: true
      title: Température · 24 h
      show_states: true
      colorize_states: true
    apex_config:
      chart:
        height: 120
        animations:
          enabled: false
        toolbar:
          show: false
        zoom:
          enabled: false
      stroke:
        curve: smooth
        width: 2
      dataLabels:
        enabled: false
      markers:
        size: 0
      legend:
        show: false
      fill:
        type: gradient
        gradient:
          opacityFrom: 0.42
          opacityTo: 0.03
          stops:
            - 0
            - 85
            - 100
      xaxis:
        labels:
          datetimeUTC: false
          format: HH:mm
          style:
            fontSize: 10px
    yaxis:
      - decimals: 1
        max: "|+0.5|"
        min: "|-0.5|"
        apex_config:
          tickAmount: 3
    series:
      - entity: sensor.zg_227z_11_temperature
        name: Température
        color: var(--success-color)
        type: area
        stroke_width: 2
        float_precision: 1
        group_by:
          func: avg
          duration: 10min
  - type: custom:apexcharts-card
    graph_span: 24h
    update_interval: 5min
    header:
      show: true
      title: Humidité · 24 h
      show_states: true
      colorize_states: true
    apex_config:
      chart:
        height: 120
        animations:
          enabled: false
        toolbar:
          show: false
        zoom:
          enabled: false
      stroke:
        curve: smooth
        width: 2
      dataLabels:
        enabled: false
      markers:
        size: 0
      legend:
        show: false
      fill:
        type: gradient
        gradient:
          opacityFrom: 0.42
          opacityTo: 0.03
          stops:
            - 0
            - 85
            - 100
      xaxis:
        labels:
          datetimeUTC: false
          format: HH:mm
          style:
            fontSize: 10px
    yaxis:
      - min: 0
        max: 100
        decimals: 0
        apex_config:
          tickAmount: 4
    series:
      - entity: sensor.zg_227z_11_humidity
        name: Humidité
        color: var(--info-color)
        type: area
        stroke_width: 2
        float_precision: 0
        group_by:
          func: avg
          duration: 10min
