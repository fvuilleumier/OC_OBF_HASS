title: Cave
path: cave
icon: mdi:bottle-wine
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F518 Interactions"
      - type: custom:mushroom-template-card
        primary: Aucune interaction configurée
        secondary: Zone réservée aux commandes de la pièce
        icon: mdi:gesture-tap
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F321️ Conditions"
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Température · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            max: '|+0.5|'
            min: '|-0.5|'
            apex_config:
              tickAmount: 3
        series:
          - entity: sensor.zg_227z_12_temperature
            name: Température
            color: var(--success-color)
            type: area
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 10min
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Humidité · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_12_humidity
            name: Humidité
            color: var(--info-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚡ Énergie
      - type: gauge
        entity: sensor.cave_power
        name: Puissance pièce
        needle: true
        min: 0
        max: 500
        severity:
          green: 0
          yellow: 300
          red: 425
        grid_options:
          columns: 6
          rows: auto
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.cave_power
            icon: mdi:flash
            primary: "{{ states('sensor.sp1pm64_power') | float(0) | round(0) }} W"
            secondary: Puissance actuelle
            tap_action:
              action: more-info
            color: orange
            features_position: bottom
            vertical: true
          - type: custom:mushroom-template-card
            entity: sensor.cave_energy_day
            icon: mdi:lightning-bolt
            primary: "{{ states('sensor.sp1pm64_energy_day') | float(0) | round(2) }} kWh"
            secondary: Énergie du jour (24 h)
            tap_action:
              action: more-info
            color: amber
            features_position: bottom
            vertical: true
        grid_options:
          columns: 6
          rows: auto
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Puissance · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 180
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: '|+10|'
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.cave_power
            name: Cave
            color: var(--warning-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
        grid_options:
          columns: full
          rows: auto
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F4DF Appareils"
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            alignment: center
            subtitle: "\U0001F377 Cave à vin"
          - type: custom:mushroom-template-card
            entity: switch.s1pm58
            icon: mdi:pump
            primary: "{% set p = states('sensor.s1pm58_power') | float(0) %} {% if not is_state('switch.s1pm58', 'on') %}Hors tension {% elif p > 5 %}En marche {% else %}En veille{% endif %}"
            secondary: "{{ states('sensor.s1pm58_power') | float(0) | round(0) }} W"
            tap_action:
              action: toggle
            color: "{% set p = states('sensor.s1pm58_power') | float(0) %} {% if not is_state('switch.s1pm58', 'on') %}red {% elif p > 5 %}orange {% else %}green{% endif %}"
            features_position: bottom
          - type: gauge
            entity: sensor.s1pm58_power
            name: Puissance
            needle: true
            min: 50
            max: 150
            severity:
              green: 0
              yellow: 90
              red: 100
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Puissance · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 160
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: '|+10|'
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.s1pm58_power
                name: Maintenant
                color: var(--warning-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.s1pm58_power
                name: moy 24 h
                color: var(--info-color)
                float_precision: 0
                group_by:
                  func: avg
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
              - entity: sensor.s1pm58_power
                name: pic 24 h
                color: var(--error-color)
                float_precision: 0
                group_by:
                  func: max
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
          - type: custom:mushroom-template-card
            entity: sensor.s1pm58_energy
            icon: mdi:lightning-bolt
            icon_color: amber
            primary: "{{ states('sensor.s1pm58_energy') | float(0) | round(2) }} kWh"
            secondary: Consommation cumulée
            tap_action:
              action: more-info
        column_span: 2
        grid_options:
          rows: auto
          columns: full
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-title-card
            alignment: center
            subtitle: ❄️ Congélateur
          - type: custom:mushroom-template-card
            entity: switch.sp1pm64
            icon: mdi:pump
            primary: "{% set p = states('sensor.sp1pm64_power') | float(0) %} {% if not is_state('switch.sp1pm64', 'on') %}Hors tension {% elif p > 5 %}En marche {% else %}En veille{% endif %}"
            secondary: "{{ states('sensor.sp1pm64_power') | float(0) | round(0) }} W"
            tap_action:
              action: toggle
            color: "{% set p = states('sensor.sp1pm64_power') | float(0) %} {% if not is_state('switch.sp1pm64', 'on') %}red {% elif p > 5 %}orange {% else %}green{% endif %}"
            features_position: bottom
          - type: gauge
            entity: sensor.sp1pm64_power
            name: Puissance
            needle: true
            min: 0
            max: 100
            severity:
              green: 0
              yellow: 35
              red: 60
          - type: custom:apexcharts-card
            graph_span: 24h
            update_interval: 5min
            header:
              show: true
              title: Puissance · 24 h
              show_states: true
              colorize_states: true
            apex_config:
              chart:
                height: 160
                animations:
                  enabled: false
                toolbar:
                  show: false
                zoom:
                  enabled: false
              stroke:
                curve: smooth
                width: 2
              dataLabels:
                enabled: false
              markers:
                size: 0
              legend:
                show: false
              fill:
                type: gradient
                gradient:
                  opacityFrom: 0.42
                  opacityTo: 0.03
                  stops:
                    - 0
                    - 85
                    - 100
              xaxis:
                labels:
                  datetimeUTC: false
                  format: HH:mm
                  style:
                    fontSize: 10px
            yaxis:
              - min: 0
                max: '|+10|'
                decimals: 0
                apex_config:
                  tickAmount: 4
            series:
              - entity: sensor.sp1pm64_power
                name: Maintenant
                color: var(--warning-color)
                type: area
                stroke_width: 2
                float_precision: 0
                group_by:
                  func: avg
                  duration: 10min
              - entity: sensor.sp1pm64_power
                name: moy 24 h
                color: var(--info-color)
                float_precision: 0
                group_by:
                  func: avg
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
              - entity: sensor.sp1pm64_power
                name: pic 24 h
                color: var(--error-color)
                float_precision: 0
                group_by:
                  func: max
                  duration: 24h
                show:
                  in_chart: false
                  in_header: true
          - type: custom:mushroom-template-card
            entity: sensor.sp1pm64_energy
            icon: mdi:lightning-bolt
            icon_color: amber
            primary: "{{ states('sensor.sp1pm64_energy') | float(0) | round(2) }} kWh"
            secondary: Consommation cumulée
            tap_action:
              action: more-info
        column_span: 2
        grid_options:
          rows: auto
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F9ED Navigation"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Toutes les pièces
            icon: mdi:home
            color: blue
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/maison
          - type: custom:mushroom-template-card
            primary: Surveillance
            icon: mdi:alert-remove
            color: purple
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/appareils-oublies
          - type: custom:mushroom-template-card
            primary: Santé système
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/sante-systeme
cards: []
badges: []
header:
  card:
    type: markdown
    text_only: true
    content: "# \U0001F377️ Cave"
