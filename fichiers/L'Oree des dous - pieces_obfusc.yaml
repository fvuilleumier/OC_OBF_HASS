                    name: moy 24 h
                    color: var(--info-color)
                    float_precision: 0
                    group_by:
                      func: avg
                      duration: 24h
                    show:
                      in_chart: false
                      in_header: true
                  - entity: sensor.s1pm31_power
                    name: pic 24 h
                    color: var(--error-color)
                    float_precision: 0
                    group_by:
                      func: max
                      duration: 24h
                    show:
                      in_chart: false
                      in_header: true
              - type: custom:mushroom-template-card
