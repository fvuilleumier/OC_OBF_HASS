title: Tests
path: tests
icon: mdi:router-network
type: custom:grid-layout
layout:
  margin: 0
  padding: 0
  grid-gap: 8px
  grid-template-columns: repeat(12, minmax(0, 1fr))
  grid-template-areas: >
    "wan wan wan wan devices devices devices devices adguard adguard adguard adguard"

    "router router router router router router router router router router router router"

    "floor floor floor floor floor floor ground ground ground ground ground ground"
  mediaquery:
    '(max-width: 1100px)':
      grid-template-columns: repeat(2, minmax(0, 1fr))
      grid-template-areas: >
        "wan devices"

        "adguard adguard"

        "router router"

        "floor ground"
    '(max-width: 700px)':
      grid-template-columns: 1fr
      grid-template-areas: >
        "wan"

        "devices"

        "adguard"

        "router"

        "floor"

        "ground"
cards:
  - type: custom:stack-in-card
    view_layout:
      grid-area: wan
    card_mod:
      style: >
        ha-card {
          height: 214px;
          overflow: hidden;
          background: var(--card-background-color);
          border: 0 !important;
          border-radius: 6px;
          box-shadow: none !important;
        }
    cards:
      - type: custom:button-card
        template: section_title_upper
        name: WAN
      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          margin: 0
          padding: 0 8px 8px 8px
          grid-gap: 0
          grid-template-columns: repeat(3, minmax(0, 1fr))
        cards:
          - type: custom:button-card
            entity: sensor.wan_upc_load
            name: UPC
            icon: mdi:web
            show_icon: true
            show_state: true
            show_label: true
            label: >
              [[[
                return entity?.attributes?.ip_address || "198.18.0.16";
              ]]]
            state_display: >
              [[[
                const value = parseFloat(entity?.state);
                return Number.isFinite(value) ? value.toFixed(1) + "%" : "N/C";
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 175px
                - padding: 4px 2px 8px
                - background: transparent
                - border: none
                - border-radius: 0
                - box-shadow: none
              grid:
                - grid-template-areas: '"i" "s" "l" "n"'
                - grid-template-rows: 52px 37px 35px 28px
              icon:
                - width: 43px
                - color: var(--secondary-text-color)
              state:
                - font-size: 28px
                - font-weight: 400
                - color: var(--success-color)
              label:
                - font-size: 15px
                - color: var(--secondary-text-color)
              name:
                - align-self: end
                - font-size: 12px
                - font-weight: 400
                - color: var(--secondary-text-color)
          - type: custom:button-card
            entity: sensor.vpn_tunnel_load
            name: VPN
            icon: mdi:shield-link-variant
            show_icon: true
            show_state: true
            show_label: true
            label: >
              [[[
                return entity?.attributes?.remote_ip || "198.18.1.78";
              ]]]
            state_display: >
              [[[
                const value = parseFloat(entity?.state);
                return Number.isFinite(value) ? value.toFixed(1) + "%" : "N/C";
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 175px
