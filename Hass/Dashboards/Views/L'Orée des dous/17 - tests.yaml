              dataLabels:
                enabled: false
              markers:
                size: 0
              fill:
                type: gradient
                gradient:
                  shadeIntensity: 0.3
                  opacityFrom: 0.42
                  opacityTo: 0.04
                  stops:
                    - 0
                    - 85
                    - 100
              legend:
                show: true
                position: bottom
                fontSize: 10px
                labels:
                  colors: var(--secondary-text-color)
                markers:
                  width: 9
                  height: 9
              xaxis:
