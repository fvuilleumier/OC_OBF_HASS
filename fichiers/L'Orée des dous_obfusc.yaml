  - type: sections
    title: Appareils oubliés
    path: appareils-oublies
    icon: mdi:alert-remove
    max_columns: 1
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            template: section_title
            name: 📜 Résumé
            grid_options:
              columns: full
          - type: custom:mushroom-template-card
            primary: |
              {% set appareils = [
                states('sensor.s1pm42_power'),
                states('sensor.sp1pm62_power'),
                states('sensor.s1pm40_power'),
                states('sensor.sp1pm63_power'),
                states('sensor.sp1pm61_power'),
              ] %} {% set actifs = appareils
                | select('is_number')
                | map('float')
                | select('gt', 8)
                | list
                | count %}
              {% set e = states.get('sensor.sp1pm70_energy') %} {% set pompe = e
                is not none and (as_timestamp(now()) - as_timestamp(e.last_changed))
                > 43200 and states('sensor.sp1pm70_power') | float(0) < 1 %}
              {% set d = states('input_datetime.cave_a_vin_dernier_allumage') %} {% set cave
                = is_state('switch.sb19_sb19_cave_a_vin', 'off') and (d in ['unknown',
                'unavailable', 'none'] or (as_timestamp(now()) - as_timestamp(d)) > 172800) %}
              {% set alertes = (1 if pompe else 0) + (1 if cave else 0) %}
              {% if actifs == 0 and alertes == 0 %}
                🟢 Rien d'anormal
              {% else %}
                🟠 {{ actifs + alertes }} anomalie(s)
              {% endif %}
            secondary: |
              Surveillance des appareils à consommation variable et des seuils
              de fonctionnement (12 h / 2 j)
            icon: |
              {% set e = states.get('sensor.sp1pm70_energy') %} {% set d = states('input_datetime.cave_a_vin_dernier_allumage') %} {% if
                states('sensor.s1pm42_power')|float(0) > 5 or
                states('sensor.sp1pm62_power')|float(0) > 5 or
                states('sensor.s1pm40_power')|float(0) > 5 or
                states('sensor.sp1pm63_power')|float(0) > 8 or
                states('sensor.sp1pm61_power')|float(0) > 5 or
                (e is not none and (as_timestamp(now()) - as_timestamp(e.last_changed)) > 43200
                 and states('sensor.sp1pm70_power') | float(0) < 1) or
                (is_state('switch.sb19_sb19_cave_a_vin', 'off') and (d in ['unknown', 'unavailable', 'none']
                 or (as_timestamp(now()) - as_timestamp(d)) > 172800))
              %}
