  - type: custom:stack-in-card
    view_layout:
      grid-area: devices
    card_mod:
      style: |
        ha-card {
          background: #282a3a;
          border: 0 !important;
          border-radius: 6px;
          box-shadow: none !important;
          overflow: hidden;
        }
    cards:

      - type: custom:button-card
        name: APPAREILS
        show_icon: false
        show_state: false
        tap_action:
          action: none
        styles:
          card:
            - height: 38px
            - padding: 0 12px
            - background: transparent
            - border: none
            - border-radius: 0
            - box-shadow: none
          grid:
            - grid-template-areas: '"n"'
          name:
            - display: flex
            - align-items: center
            - justify-content: center
            - gap: 10px
            - width: 100%
            - color: "#f3f3f6"
            - font-size: 14px
            - font-weight: 400
        extra_styles: |
          #name::before,
          #name::after {
            content: "";
            height: 1px;
            background: #8d8f9c;
            flex: 1;
          }

      - type: custom:layout-card
        layout_type: custom:grid-layout
        layout:
          margin: 0
          padding: 4px 10px 10px
          grid-gap: 8px
          grid-template-columns: repeat(2, minmax(0, 1fr))
        cards:

          - type: custom:button-card
            entity: switch.s1pm30
            name: ALIMENTATION SERVEURS
            icon: mdi:server-network
            show_icon: true
            show_state: true
            show_label: true
            label: |
              [[[
                return entity?.state === "on"
                  ? "Sous tension"
                  : "Hors tension";
              ]]]
            state_display: |
              [[[
                return entity?.state === "on" ? "ON" : "OFF";
              ]]]
            tap_action:
              action: toggle
            styles:
              card:
                - height: 165px
                - padding: 10px 6px
                - background: rgba(255,255,255,0.025)
                - border: 1px solid rgba(255,255,255,0.04)
                - border-radius: 5px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i" "s" "l" "n"'
                - grid-template-rows: 52px 35px 30px 28px
              icon:
                - width: 43px
                - color: |
                    [[[
                      return entity?.state === "on"
                        ? "#82df2f"
                        : "#e84b52";
                    ]]]
              state:
                - font-size: 27px
                - font-weight: 400
                - color: |
                    [[[
                      return entity?.state === "on"
                        ? "#82df2f"
                        : "#e84b52";
                    ]]]
              label:
                - font-size: 13px
                - color: "#aeb0bd"
              name:
                - font-size: 11px
                - color: "#aeb0bd"

          - type: custom:button-card
            entity: sensor.ups_battery_charge
            name: BATTERIE UPS
            icon: mdi:battery-high
            show_icon: true
            show_state: true
            show_label: true
            label: Charge disponible
            state_display: |
              [[[
                const value = parseFloat(entity?.state);
                return Number.isFinite(value)
                  ? value.toFixed(0) + " %"
                  : entity?.state;
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 165px
                - padding: 10px 6px
                - background: rgba(255,255,255,0.025)
                - border: 1px solid rgba(255,255,255,0.04)
                - border-radius: 5px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i" "s" "bar" "l" "n"'
                - grid-template-rows: 42px 31px 13px 26px 27px
              icon:
                - width: 40px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value <= 20) return "#e84b52";
                      if (value <= 50) return "#efa928";
                      return "#82df2f";
                    ]]]
              state:
                - font-size: 27px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value <= 20) return "#e84b52";
                      if (value <= 50) return "#efa928";
                      return "#82df2f";
                    ]]]
              custom_fields:
                bar:
                  - width: 78%
                  - height: 6px
                  - border-radius: 5px
                  - overflow: hidden
                  - background: rgba(255,255,255,0.1)
                  - justify-self: center
              label:
                - font-size: 13px
                - color: "#aeb0bd"
              name:
                - font-size: 11px
                - color: "#aeb0bd"
            custom_fields:
              bar: |
                [[[
                  const value = Math.max(
                    0,
                    Math.min(100, parseFloat(entity?.state) || 0)
                  );

                  let color = "#82df2f";
                  if (value <= 20) color = "#e84b52";
                  else if (value <= 50) color = "#efa928";

                  return `
                    <div style="
                      width:${value}%;
                      height:100%;
                      border-radius:5px;
                      background:${color};
                    "></div>
                  `;
                ]]]

