title: Chambre TBX9F_ORG_0005
path: chambre-TBX9F_ORG_0005
icon: mdi:human-child
type: sections
max_columns: 3
sections:
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F518 Interactions"
      - type: custom:mushroom-template-card
        primary: Aucune interaction configurée
        secondary: Zone réservée aux commandes de la pièce
        icon: mdi:gesture-tap
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F321️ Conditions"
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Température · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - decimals: 1
            max: '|+0.5|'
            min: '|-0.5|'
            apex_config:
              tickAmount: 3
        series:
          - entity: sensor.zg_227z_15_temperature
            name: Température
            color: var(--success-color)
            type: area
            stroke_width: 2
            float_precision: 1
            group_by:
              func: avg
              duration: 10min
      - type: custom:apexcharts-card
        graph_span: 24h
        update_interval: 5min
        header:
          show: true
          title: Humidité · 24 h
          show_states: true
          colorize_states: true
        apex_config:
          chart:
            height: 120
            animations:
              enabled: false
            toolbar:
              show: false
            zoom:
              enabled: false
          stroke:
            curve: smooth
            width: 2
          dataLabels:
            enabled: false
          markers:
            size: 0
          legend:
            show: false
          fill:
            type: gradient
            gradient:
              opacityFrom: 0.42
              opacityTo: 0.03
              stops:
                - 0
                - 85
                - 100
          xaxis:
            labels:
              datetimeUTC: false
              format: HH:mm
              style:
                fontSize: 10px
        yaxis:
          - min: 0
            max: 100
            decimals: 0
            apex_config:
              tickAmount: 4
        series:
          - entity: sensor.zg_227z_15_humidity
            name: Humidité
            color: var(--info-color)
            type: area
            stroke_width: 2
            float_precision: 0
            group_by:
              func: avg
              duration: 10min
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: ⚡ Énergie
      - type: custom:mushroom-template-card
        primary: Pas encore mesurée
        secondary: Aucun compteur électrique dédié à cette pièce n'est actuellement disponible.
        icon: mdi:power-plug-off
        features_position: bottom
        vertical: true
        multiline_secondary: false
        grid_options:
          columns: full
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F4DF Appareils"
      - type: custom:vertical-stack-in-card
        cards:
          - type: custom:mushroom-media-player-card
            entity: media_player.chambre_yoto_d_TBX9F_ORG_0005
            volume_controls:
              - volume_mute
              - volume_set
              - volume_buttons
            media_controls:
              - on_off
              - shuffle
              - previous
              - play_pause_stop
              - next
              - repeat
            fill_container: false
          - type: custom:mushroom-template-card
            primary: Batterie
            secondary: "{{ states('sensor.chambre_yoto_d_TBX9F_ORG_0005_battery') }} %"
            icon: mdi:battery
            icon_color: >
              {% set b = states('sensor.chambre_yoto_d_TBX9F_ORG_0005_battery') | float(0) %} {% if b < 20 %}red {% elif b < 50 %}orange {% else %}green {% endif %}
        title: "\U0001F39A️ Yoto"
        grid_options:
          rows: auto
          columns: 6
  - type: grid
    column_span: 1
    cards:
      - type: custom:button-card
        template: section_title
        name: "\U0001F9ED Navigation"
      - type: grid
        cards:
          - type: custom:mushroom-template-card
            primary: Toutes les pièces
            icon: mdi:home
            color: blue
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/maison
          - type: custom:mushroom-template-card
            primary: Surveillance
            icon: mdi:alert-remove
            color: purple
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/appareils-oublies
          - type: custom:mushroom-template-card
            primary: Santé système
            icon: mdi:heart-pulse
            color: red
            vertical: true
            features_position: bottom
            tap_action:
              action: navigate
              navigation_path: /la-maison-des-dous/sante-systeme
cards: []
badges: []
header:
  card:
    type: markdown
    text_only: true
    content: "# \U0001F466\U0001F3FB️ Chambre TBX9F_ORG_0005"
