                return Number.isFinite(value)
                  ? value.toFixed(1) + " °C"
                  : entity?.state;
              ]]]
            tap_action:
              action: more-info
            styles:
              card:
                - height: 100px
                - padding: 8px 12px
                - background: rgba(255,255,255,0.025)
                - border: 1px solid rgba(255,255,255,0.04)
                - border-radius: 5px
                - box-shadow: none
              grid:
                - grid-template-areas: '"i s" "i l" "i n"'
                - grid-template-columns: 52px 1fr
                - grid-template-rows: 32px 24px 24px
              icon:
                - width: 35px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value >= 70) return "#e84b52";
                      if (value >= 55) return "#efa928";
                      return "#82df2f";
                    ]]]
              state:
                - justify-self: start
                - font-size: 20px
                - color: |
                    [[[
                      const value = parseFloat(entity?.state);
                      if (!Number.isFinite(value)) return "#aeb0bd";
                      if (value >= 70) return "#e84b52";
                      if (value >= 55) return "#efa928";
                      return "#82df2f";
                    ]]]
              label:
                - justify-self: start
                - font-size: 11px
                - color: "#aeb0bd"
              name:
                - justify-self: start
                - font-size: 11px
                - color: "#aeb0bd"

          - type: custom:button-card
            entity: binary_sensor.slzb_06m_ethernet
            name: ETHERNET
            icon: mdi:ethernet
            show_icon: true
            show_state: true
            show_label: true
            label: |
              [[[
                return entity?.state === "on"
                  ? "Connecté"
                  : "Déconnecté";
              ]]]
            state_display: |
              [[[
                return entity?.state === "on" ? "ONLINE" : "OFFLINE";
